# Render.com Blueprint: New > Blueprint > izaberite ovaj repozitorijum.
services:
  - type: web
    name: servis-sajt
    runtime: node
    plan: starter          # disk za bazu zahteva plaćeni plan; besplatan plan briše podatke pri restartu
    region: frankfurt
    buildCommand: "true"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
    disk:
      name: servis-data
      mountPath: /var/data
      sizeGB: 1
